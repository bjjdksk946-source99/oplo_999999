
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPLO STORE</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #101018;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}
.container {
    max-width: 450px;
    margin: auto;
}
h1 {
    color: #00eaff;
    text-shadow: 0 0 12px #00bfff;
}
.subtitle {
    color: #ccc;
}
.product {
    background: #1d1d2b;
    border: 1px solid #34344a;
    border-radius: 15px;
    padding: 15px;
    margin: 15px 0;
}
.product-img {
    width: 150px;
    height: 150px;
    object-fit: contain;
    display: block;
    margin: 10px auto;
}
.price {
    color: #00ff99;
    font-size: 23px;
    font-weight: bold;
}
.payment {
    background: #262638;
    border-radius: 12px;
    padding: 12px;
    margin-top: 20px;
}
.whatsapp {
    display: inline-block;
    background: #20c76a;
    color: white;
    text-decoration: none;
    padding: 13px 25px;
    border-radius: 10px;
    margin-top: 15px;
    font-weight: bold;
}
footer {
    color: #aaa;
    margin-top: 25px;
    font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

<h1>🔥 OPLO STORE 🔥</h1>
<p class="subtitle">متجرك المفضل لحيوانات ماب السرقة 💎</p>

<div class="product">
    <h2>قرمة عادية</h2>
    <img src="qarma.jpg" class="product-img" alt="قرمة عادية">
    <p class="price">6 د.ل</p>
</div>

<div class="product">
    <h2>قرمة مطورة</h2>
    <img src="qarma.jpg" class="product-img" alt="قرمة مطورة">
    <p class="price">8 د.ل</p>
</div>

<div class="product">
    <h2>Dragon عادي 🐉</h2>
    <img src="dragon.jpg" class="product-img" alt="دراقون عادي">
    <p class="price">80 د.ل</p>
</div>

<div class="product">
    <h2>Dragon مطور 🐉</h2>
    <img src="dragon.jpg" class="product-img" alt="دراقون مطور">
    <p class="price">90 د.ل</p>
</div>

<div class="payment">
    <h3>💳 طرق الدفع</h3>
    <p>نقبل رصيد ليبيانا والمدار 📱</p>
</div>

<a class="whatsapp"
href="https://wa.me/"
target="_blank">
تواصل معنا عبر واتساب
</a>

<footer>
❤️ ثقتكم هي نجاحنا — OPLO STORE
</footer>

</div>
</body>
</html>
